<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="中国旅行博主在柬埔寨使用的旅行与采访英语工具">
  <title>柬埔寨旅行采访英语</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero__eyebrow">Cambodia Field Notes</div>
    <h1>柬埔寨旅行采访英语</h1>
    <p>七天行程的旅行办事、街头采访、发音与实战对话。</p>
    <div class="hero__meta">
      <span>7天行程</span><span>旅行办事</span><span>街头采访</span>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="查找工具">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索：房租、拍摄、说慢一点…" autocomplete="off">
      </label>
      <button id="favoriteToggle" class="soft-button" type="button" aria-pressed="false">☆ 只看收藏</button>
    </section>

    <nav class="tabs" aria-label="浏览方式">
      <button class="tab is-active" type="button" data-mode="day">按天</button>
      <button class="tab" type="button" data-mode="scene">按场景</button>
      <button class="tab" type="button" data-mode="toolkit">采访工具箱</button>
      <button class="tab" type="button" data-mode="all">全部</button>
    </nav>

    <section id="dayFilter" class="filter-strip" aria-label="按天筛选">
      <button class="filter-chip is-active" type="button" data-day="day1"><span>D1</span>金边抵达</button>
      <button class="filter-chip" type="button" data-day="day2"><span>D2</span>金边采访</button>
      <button class="filter-chip" type="button" data-day="day3"><span>D3</span>前往西港</button>
      <button class="filter-chip" type="button" data-day="day4"><span>D4</span>西港深访</button>
      <button class="filter-chip" type="button" data-day="day5"><span>D5</span>吴哥古迹</button>
      <button class="filter-chip" type="button" data-day="day6"><span>D6</span>浮村与湖</button>
      <button class="filter-chip" type="button" data-day="day7"><span>D7</span>返程转机</button>
    </section>

    <section id="sceneFilter" class="filter-strip" aria-label="按场景筛选" hidden>
      <button class="filter-chip is-active" type="button" data-category="all">全部场景</button>
      <button class="filter-chip" type="button" data-category="transport">交通</button>
      <button class="filter-chip" type="button" data-category="hotel">酒店</button>
      <button class="filter-chip" type="button" data-category="attraction">景点</button>
      <button class="filter-chip" type="button" data-category="food">餐饮市场</button>
      <button class="filter-chip" type="button" data-category="interview">采访</button>
      <button class="filter-chip" type="button" data-category="safety">安全应急</button>
    </section>

    <section class="intro-card">
      <div>
        <span class="kicker">使用方法</span>
        <h2 id="viewTitle">第一天 · 金边</h2>
      </div>
      <p id="viewDescription">抵达、入住、参观吐斯廉屠杀博物馆，并在夜市采访当地人的生活成本。</p>
    </section>

    <section id="content" class="content" aria-live="polite"></section>
    <p id="emptyState" class="empty" hidden>没有找到匹配内容，换一个关键词试试。</p>
  </main>

  <template id="sectionTemplate">
    <article class="scene">
      <button class="scene__header" type="button" aria-expanded="true">
        <span>
          <span class="scene__tag"></span>
          <span class="scene__title"></span>
          <span class="scene__subtitle"></span>
        </span>
        <span class="scene__chevron" aria-hidden="true">⌄</span>
      </button>
      <div class="scene__body">
        <div class="phrase-list"></div>
        <div class="pronunciation-panel" hidden></div>
        <div class="dialogue-panel" hidden></div>
      </div>
    </article>
  </template>

  <template id="phraseTemplate">
    <article class="phrase-card">
      <div class="phrase-card__topline">
        <span class="phrase-card__kind"></span>
        <button class="favorite-button" type="button" aria-label="收藏这句话">☆</button>
      </div>
      <p class="english"></p>
      <p class="chinese"></p>
      <p class="note" hidden></p>
      <div class="phrase-card__actions">
        <button class="speak-button" type="button">▶ 朗读</button>
        <button class="copy-button" type="button">复制</button>
      </div>
    </article>
  </template>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="all-days.js"></script>
  <script src="app.js"></script>
</body>
</html>
